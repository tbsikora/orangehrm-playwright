services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: orangehrm
      MARIADB_USER: orangehrm
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./docker/init/02-admin-fixup.sql:/docker-entrypoint-initdb.d/02-admin-fixup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Use docker/up.sh instead of `docker compose up` directly - see that script
  # for why (orangehrm/orangehrm:5.9's baked-in VOLUME /var/www/html otherwise
  # masks rebuilds with a stale anonymous volume).
  orangehrm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: orangehrm-playwright/orangehrm:5.9-testid
    platform: linux/amd64
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
